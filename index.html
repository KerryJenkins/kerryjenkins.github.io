<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=0.9">

  <title>zbar-wasm example</title>

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/main.css">

  <link rel="icon" type="image/png" href="img/favicon.png">
</head>

<body>
<div class="container">

  <button id="videoBtn">Scan</button>

  <div class="viewport">
    <canvas id="canvas"></canvas>
    <video id="video" muted autoplay playsinline></video>
  </div>

  <h5>Result</h5>
  <pre id="result" ></pre>

  <form id="form" action="result.html" name="resultForm" id="resultForm" method="post">
    <input type="hidden" id="barcode" name="barcode">
  </form>
</div> 

<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js"></script>
<script src="js/main.js"></script>

</body>
</html>
